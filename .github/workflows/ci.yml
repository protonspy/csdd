name: ci

# Test + validate gate. Runs on every PR, and is reusable (workflow_call) so
# the release pipeline can require it as a gate before building any binaries.
# Pushes to main are covered by the release workflow, which calls this one —
# so there is no separate push trigger here (avoids duplicate runs).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

  mcp-server:
    name: mcp-server (build & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      # Node 24: the unit tests are TypeScript run through node:test with native
      # type stripping (Node >= 22.18). The published package ships compiled JS
      # (dist/) and still supports Node >= 18 — see package.json "engines".
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: install
        run: npm ci

      - name: test (build + node:test)
        run: npm test
